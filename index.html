<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>مواقيت الصلاة في اللاذقية</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* ===== أساسيات: كل القياسات بوحدة rem، والمسرح 96×54rem يتمدد ليملأ الشاشة ===== */
* { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 1.851852vh; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #040A11; }
body { font-family: 'Amiri', 'Tahoma', 'Arial', sans-serif; color: #F3E9D2; -webkit-font-smoothing: antialiased; }
.kufi { font-family: 'Reem Kufi', 'Tahoma', 'Arial', sans-serif; }

#stage { position: absolute; left: 50%; top: 50%; width: 96rem; height: 54rem; margin-left: -48rem; margin-top: -27rem; overflow: hidden; background: #06111C; }

/* ===== السماء والبحر ===== */
.sky { position: absolute; left: 0; top: 0; width: 96rem; height: 54rem; opacity: 0; will-change: opacity; }
#skyWindow { position: absolute; left: 0; top: 0; width: 96rem; height: 36.5rem; overflow: hidden; z-index: 3; }
#stars { position: absolute; left: 0; top: 0; width: 96rem; height: 36.5rem; transition: opacity 40s linear; }
.star { position: absolute; display: block; border-radius: 50%; background: #FFF6E0; opacity: 0.6; animation: twinkle 5s ease-in-out infinite alternate; }
#stars.paused .star { animation-play-state: paused; }
@keyframes twinkle { from { opacity: 0.12; } to { opacity: 1; } }

#clouds { position: absolute; left: 0; top: 0; width: 96rem; height: 36.5rem; transition: opacity 40s linear; }
.cloud { position: absolute; left: 0; will-change: transform; animation: drift 300s linear infinite; }
.cloud svg { display: block; width: 100%; height: 100%; fill: #FFFFFF; }
@keyframes drift { from { transform: translateX(-22rem); } to { transform: translateX(104rem); } }

#sun, #moon { position: absolute; left: 0; top: 0; width: 0; height: 0; opacity: 0; will-change: transform; }
.sun-halo { position: absolute; left: -8rem; top: -8rem; width: 16rem; height: 16rem; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,228,165,0.55) 0%, rgba(255,214,140,0.20) 34%, rgba(255,214,140,0) 68%); }
.sun-core { position: absolute; left: -1.8rem; top: -1.8rem; width: 3.6rem; height: 3.6rem; border-radius: 50%;
  background: radial-gradient(circle at 44% 40%, #FFFCEE 0%, #FFE7A8 55%, #F6C163 100%); }
[data-p="sunrise"] .sun-core, [data-p="sunset"] .sun-core { background: radial-gradient(circle at 44% 40%, #FFEBC8 0%, #FFB066 58%, #EE7840 100%); }
[data-p="sunrise"] .sun-halo, [data-p="sunset"] .sun-halo { background: radial-gradient(circle, rgba(255,160,95,0.62) 0%, rgba(255,140,80,0.22) 36%, rgba(255,140,80,0) 70%); }
.moon-halo { position: absolute; left: -6rem; top: -6rem; width: 12rem; height: 12rem; border-radius: 50%;
  background: radial-gradient(circle, rgba(220,228,255,0.30) 0%, rgba(220,228,255,0.08) 40%, rgba(220,228,255,0) 70%); }
.moon-disc { position: absolute; left: -1.7rem; top: -1.7rem; width: 3.4rem; height: 3.4rem; }

#sea { position: absolute; left: 0; top: 36.5rem; width: 96rem; height: 17.5rem; overflow: hidden; z-index: 3; }
#horizon { position: absolute; left: 0; top: 0; width: 96rem; height: 0.08rem; background: rgba(255,240,214,0.28); }
#reflect { position: absolute; left: 0; top: 0; width: 7rem; margin-left: -3.5rem; height: 15rem; opacity: 0;
  background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 0.32rem, rgba(6,16,26,0.45) 0.32rem, rgba(6,16,26,0.45) 0.46rem),
              radial-gradient(ellipse 50% 100% at 50% 0%, rgba(255,216,150,0.85) 0%, rgba(255,216,150,0.3) 40%, rgba(255,216,150,0) 100%);
  animation: glint 3.4s ease-in-out infinite alternate; will-change: transform; }
#reflect.moonref { background: repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0, rgba(0,0,0,0) 0.32rem, rgba(6,16,26,0.45) 0.32rem, rgba(6,16,26,0.45) 0.46rem),
              radial-gradient(ellipse 40% 100% at 50% 0%, rgba(226,232,255,0.7) 0%, rgba(226,232,255,0.22) 40%, rgba(226,232,255,0) 100%); }
@keyframes glint { from { transform: scaleX(0.75); } to { transform: scaleX(1.15); } }
#reflectWrap { position: absolute; left: 0; top: 0; width: 0; height: 15rem; }
.wave { position: absolute; display: block; height: 0.09rem; border-radius: 0.05rem; background: rgba(243,233,210,0.45); opacity: 0.3; animation: wave 7s ease-in-out infinite alternate; }
@keyframes wave { from { transform: translateX(-0.9rem); opacity: 0.12; } to { transform: translateX(0.9rem); opacity: 0.55; } }

/* ===== العمارة: القوس الكبير والقناديل والرواق ===== */
#bigArch { position: absolute; left: 0; top: 0; width: 96rem; height: 54rem; z-index: 4; }
#bigArch path { fill: none; }
.ab-l { stroke: #EADFC6; stroke-opacity: 0.24; stroke-width: 7; stroke-dasharray: 11 11; }
.ab-d { stroke: #141B1F; stroke-opacity: 0.32; stroke-width: 7; stroke-dasharray: 11 11; stroke-dashoffset: 11; }
.ab-in { stroke: #D6AE62; stroke-opacity: 0.50; stroke-width: 1.2; }
.ab-out { stroke: #D6AE62; stroke-opacity: 0.22; stroke-width: 1; }

.lantern { position: absolute; top: 0; width: 3.6rem; margin-left: -1.8rem; z-index: 5; transform-origin: 50% 0; animation: swing 6.8s ease-in-out infinite alternate; will-change: transform; }
.lantern .chain { width: 0.1rem; margin: 0 auto; background: linear-gradient(to bottom, #6E5424, #D6AE62); }
.lantern .lsvg { position: relative; display: block; width: 3.6rem; height: 7.44rem; z-index: 1; }
.lantern .glowwrap { position: absolute; left: 50%; width: 13rem; height: 13rem; margin-left: -6.5rem; transition: opacity 40s linear; }
.lantern .glow { width: 13rem; height: 13rem; border-radius: 50%;
  background: radial-gradient(circle, rgba(255,198,105,0.50) 0%, rgba(255,186,96,0.16) 38%, rgba(255,186,96,0) 68%);
  animation: flicker 3.1s ease-in-out infinite alternate; }
@keyframes swing { from { transform: rotate(-2.3deg); } to { transform: rotate(2.3deg); } }
@keyframes flicker { 0% { opacity: 0.72; } 45% { opacity: 1; } 100% { opacity: 0.84; } }

#arcade { position: absolute; left: 0; top: 39.2rem; width: 96rem; height: 14.8rem; z-index: 6; }
#arcade svg { display: block; width: 96rem; height: 14.8rem; }
.mer, .wall { fill: #11171B; fill-opacity: 0.96; }
.courses rect { fill: #EADFC6; fill-opacity: 0.05; }
.bay-fill { fill: #061018; fill-opacity: 0.50; }
.bay-fill.next { fill: #256B57; fill-opacity: 0.72; }
.bay-pat { opacity: 0.08; }
.bay-pat.next { opacity: 0.30; }
.vl { fill: none; stroke: #EADFC6; stroke-opacity: 0.55; stroke-width: 7; stroke-dasharray: 6 6; }
.vd { fill: none; stroke: #222B30; stroke-width: 7; stroke-dasharray: 6 6; stroke-dashoffset: 6; }
.vline { fill: none; stroke: #D6AE62; stroke-opacity: 0.6; stroke-width: 1.1; }
.floor { fill: #0B1013; }
.floorline, .topline { fill: #D6AE62; fill-opacity: 0.5; }

/* ===== النصوص ===== */
#ui { position: absolute; left: 0; top: 0; width: 96rem; height: 54rem; z-index: 7; transition: transform 3s ease; }
.shadow { text-shadow: 0 0.12rem 0.7rem rgba(0,0,0,0.5); }

#cityBlock { position: absolute; top: 2.5rem; right: 10.5rem; text-align: right; }
#city { font-size: 2.7rem; font-weight: 600; line-height: 1.15; }
#country { font-size: 1.35rem; opacity: 0.78; line-height: 1.3; }
#status { margin-top: 0.55rem; font-size: 1.12rem; line-height: 1.3; white-space: nowrap; }
#status svg { width: 1.2rem; height: 1.2rem; vertical-align: -0.22rem; margin-left: 0.35rem; }
#status.on { color: #BFE3C9; }
#status.off { color: #F2C98A; }
#status.warn { color: #F2C98A; }

#dateBlock { position: absolute; top: 2.5rem; left: 10.5rem; text-align: left; }
#dayName { font-size: 2.3rem; font-weight: 600; line-height: 1.2; }
#gDate { font-size: 1.4rem; line-height: 1.45; }
#hDate { font-size: 1.4rem; line-height: 1.35; color: #E7C47C; }

#clock { position: absolute; top: 8.2rem; left: 0; width: 96rem; text-align: center; direction: ltr; unicode-bidi: embed; line-height: 1; white-space: nowrap; }
#clock span { display: inline-block; }
#ckHm { font-size: 8.6rem; font-weight: 600; letter-spacing: 0.02em; }
#ckSec { font-size: 3.3rem; font-weight: 500; opacity: 0.66; margin-left: 0.5rem; }
#ckAp { font-size: 2.8rem; font-weight: 500; color: #E7C47C; margin-right: 0.9rem; }

#countdown { position: absolute; top: 18.3rem; left: 0; width: 96rem; text-align: center; white-space: nowrap; }
#cdLabel { font-size: 2rem; opacity: 0.9; }
#cdTime { font-size: 3rem; font-weight: 600; margin-right: 0.6rem; display: inline-block; }
#countdown.soon #cdTime { color: #F2D28E; animation: soon 1.6s ease-in-out infinite alternate; }
@keyframes soon { from { opacity: 1; } to { opacity: 0.55; } }

#verse { position: absolute; top: 24rem; left: 23rem; width: 50rem; text-align: center; opacity: 0; transform: translateY(0.6rem); transition: opacity 0.9s ease, transform 0.9s ease; }
#verse.show { opacity: 1; transform: translateY(0); }
#verseText { font-size: 2.3rem; line-height: 1.75; }
#verseText.mid { font-size: 2.05rem; }
#verseText.long { font-size: 1.85rem; }
#verseRef { margin-top: 0.4rem; font-size: 1.2rem; color: #E7C47C; }

.bay { position: absolute; top: 40.8rem; width: 13.2rem; height: 11.8rem; text-align: center; }
.bay-icon { position: absolute; top: 1.5rem; left: 50%; width: 2.5rem; height: 2.5rem; margin-left: -1.25rem; color: #D6AE62; }
.bay-icon svg { display: block; width: 2.5rem; height: 2.5rem; }
.bay-name { position: absolute; top: 4.3rem; left: 0; width: 13.2rem; font-size: 1.95rem; font-weight: 500; line-height: 1.2; transition: opacity 1s; }
.bay-time { position: absolute; top: 6.7rem; left: 0; width: 13.2rem; font-size: 2.9rem; font-weight: 600; line-height: 1.2; white-space: nowrap; transition: opacity 1s, color 1s; }
.bay-time .ap { font-size: 1.45rem; font-weight: 500; opacity: 0.8; }
.bay.is-passed .bay-name, .bay.is-passed .bay-time, .bay.is-passed .bay-icon { opacity: 0.45; }
.bay.is-next .bay-time { color: #F6D893; }
.bay.is-next .bay-icon { color: #F6D893; }

#demoBadge { position: absolute; left: 1.2rem; bottom: 0.4rem; font-size: 1rem; color: #F2C98A; display: none; z-index: 8; }

/* ===== الطبقات المنبثقة ===== */
.overlay { position: absolute; left: 0; top: 0; width: 96rem; height: 54rem; z-index: 30; opacity: 0; visibility: hidden; transition: opacity 1.2s ease, visibility 0s linear 1.2s; }
.overlay.show { opacity: 1; visibility: visible; transition: opacity 1.2s ease; }

#adhan { background: radial-gradient(ellipse 62% 72% at 50% 40%, rgba(20,64,54,0.95) 0%, rgba(4,10,16,0.97) 72%); }
#adGlow { position: absolute; left: 18rem; top: -4rem; width: 60rem; height: 50rem; border-radius: 50%;
  background: radial-gradient(ellipse at center, rgba(214,174,98,0.30) 0%, rgba(214,174,98,0) 62%);
  animation: breathe 4.6s ease-in-out infinite alternate; }
@keyframes breathe { from { opacity: 0.5; transform: scale(0.94); } to { opacity: 1; transform: scale(1.04); } }
#adArch { position: absolute; left: 26rem; top: 3.5rem; width: 44rem; height: 35rem; }
#adArch path { fill: none; stroke: #D6AE62; stroke-width: 2; stroke-linecap: round; }
#adArch path.thin { stroke-width: 1; stroke-opacity: 0.5; }
#adKicker { position: absolute; top: 14.2rem; left: 0; width: 96rem; text-align: center; font-size: 2.3rem; opacity: 0.9; }
#adTitle { position: absolute; top: 17.4rem; left: 0; width: 96rem; text-align: center; font-size: 7rem; font-weight: 700; color: #F2D28E; line-height: 1.2; }
#adTime { position: absolute; top: 27.6rem; left: 0; width: 96rem; text-align: center; font-size: 2.8rem; font-weight: 500; opacity: 0.85; }
#adTime .ap { font-size: 1.6rem; }
#adDua { position: absolute; top: 40.2rem; left: 20rem; width: 56rem; text-align: center; opacity: 0; transition: opacity 1.6s ease; }
#adDua.show { opacity: 1; }
#adDuaText { font-size: 2.15rem; line-height: 1.75; }
#adDuaRef { font-size: 1.2rem; color: #E7C47C; margin-top: 0.3rem; }
#adHint { position: absolute; bottom: 1.6rem; left: 0; width: 96rem; text-align: center; font-size: 1.3rem; opacity: 0.7; }

#splash { background: rgba(3,8,14,0.6); }
#splashCard { position: absolute; left: 26rem; top: 6.5rem; width: 44rem; height: 41rem; text-align: center; }
#splashCard svg.frame { position: absolute; left: 0; top: 0; width: 44rem; height: 41rem; }
#splashIcon { position: absolute; top: 7.2rem; left: 50%; width: 4rem; height: 4rem; margin-left: -2rem; color: #E7C47C; }
#splashTitle { position: absolute; top: 11.8rem; left: 0; width: 44rem; font-size: 3.3rem; font-weight: 600; line-height: 1.2; }
#splashText { position: absolute; top: 17.2rem; left: 5rem; width: 34rem; font-size: 1.75rem; line-height: 1.6; }
#startBtn { position: absolute; top: 24.6rem; left: 50%; width: 22rem; margin-left: -11rem; padding: 0.75rem 0; font-family: 'Reem Kufi', 'Tahoma', sans-serif; font-size: 1.9rem; font-weight: 600; color: #F3E9D2; background: #2E7D66; border: 0.12rem solid #D6AE62; border-radius: 0.8rem; outline: none; cursor: pointer; }
#startBtn:focus { box-shadow: 0 0 0 0.35rem rgba(214,174,98,0.55); }
#splashKeys { position: absolute; top: 31.4rem; left: 5rem; width: 34rem; font-size: 1.3rem; line-height: 1.6; opacity: 0.75; }

@media (prefers-reduced-motion: reduce) {
  .lantern, .star, .wave, .cloud, #reflect, .glow, #adGlow, #countdown.soon #cdTime { animation: none !important; }
}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <radialGradient id="lgGlow" cx="50%" cy="55%" r="60%">
      <stop offset="0" stop-color="#FFF1C4"/>
      <stop offset="0.55" stop-color="#F6BE55"/>
      <stop offset="1" stop-color="#B9701D"/>
    </radialGradient>
    <pattern id="lgLattice" width="7" height="7" patternUnits="userSpaceOnUse">
      <path d="M0 0L7 7M7 0L0 7" stroke="#5E4216" stroke-width="1.5"/>
    </pattern>
  </defs>
</svg>

<div id="stage">
  <div id="skyA" class="sky"></div>
  <div id="skyB" class="sky"></div>

  <div id="skyWindow">
    <div id="stars"></div>
    <div id="clouds">
      <div class="cloud" style="top:5.5rem;width:15rem;height:6rem;animation-duration:310s;animation-delay:-60s;opacity:0.55"><svg viewBox="0 0 200 80"><path d="M28 70a20 20 0 0 1 6-39 30 30 0 0 1 56-12 24 24 0 0 1 42 4 22 22 0 0 1 40 12 18 18 0 0 1 2 35z"/></svg></div>
      <div class="cloud" style="top:13rem;width:10rem;height:4rem;animation-duration:380s;animation-delay:-250s;opacity:0.4"><svg viewBox="0 0 200 80"><path d="M28 70a20 20 0 0 1 6-39 30 30 0 0 1 56-12 24 24 0 0 1 42 4 22 22 0 0 1 40 12 18 18 0 0 1 2 35z"/></svg></div>
      <div class="cloud" style="top:21rem;width:19rem;height:7.6rem;animation-duration:460s;animation-delay:-140s;opacity:0.35"><svg viewBox="0 0 200 80"><path d="M28 70a20 20 0 0 1 6-39 30 30 0 0 1 56-12 24 24 0 0 1 42 4 22 22 0 0 1 40 12 18 18 0 0 1 2 35z"/></svg></div>
    </div>
    <div id="sun"><div class="sun-halo"></div><div class="sun-core"></div></div>
    <div id="moon"><div class="moon-halo"></div>
      <svg class="moon-disc" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="#C8D2E0" fill-opacity="0.17"/><path id="moonLit" fill="#F4EEDC" d=""/></svg>
    </div>
  </div>

  <div id="sea">
    <div id="horizon"></div>
    <div id="reflectWrap"><div id="reflect"></div></div>
    <div id="waves"></div>
  </div>

  <svg id="bigArch" viewBox="0 0 960 540" aria-hidden="true">
    <path class="ab-l" d="M210 392V170C210 104 330 70 480 36C630 70 750 104 750 170V392"/>
    <path class="ab-d" d="M210 392V170C210 104 330 70 480 36C630 70 750 104 750 170V392"/>
    <path class="ab-in" d="M219 392V171C219 109 335 77 480 45C625 77 741 109 741 171V392"/>
    <path class="ab-out" d="M201 392V169C201 99 325 63 480 27C635 63 759 99 759 169V392"/>
  </svg>

  <div id="lanternL" class="lantern" style="left:5.4rem;animation-duration:6.6s"></div>
  <div id="lanternR" class="lantern" style="left:90.6rem;animation-duration:7.9s;animation-delay:-2.4s"></div>

  <div id="arcade"></div>

  <div id="ui">
    <div id="cityBlock" class="shadow">
      <div id="city" class="kufi"></div>
      <div id="country"></div>
      <div id="status"><span id="statusIcon"></span><span id="statusText"></span></div>
    </div>
    <div id="dateBlock" class="shadow">
      <div id="dayName" class="kufi"></div>
      <div id="gDate"></div>
      <div id="hDate"></div>
    </div>
    <div id="clock" class="kufi shadow"><span id="ckAp"></span><span id="ckHm"></span><span id="ckSec"></span></div>
    <div id="countdown" class="shadow"><span id="cdLabel"></span><span id="cdTime" class="kufi"></span></div>
    <div id="verse" class="shadow"><div id="verseText"></div><div id="verseRef"></div></div>
    <div id="bays"></div>
    <div id="demoBadge">وضع التجربة: الوقت المعروض ليس الوقت الحقيقي</div>
  </div>

  <div id="adhan" class="overlay">
    <div id="adGlow"></div>
    <svg id="adArch" viewBox="0 0 440 350" aria-hidden="true">
      <path id="adArchPath" d="M20 348V150C20 92 120 52 220 14C320 52 420 92 420 150V348"/>
      <path class="thin" d="M34 348V152C34 100 128 64 220 30C312 64 406 100 406 152V348"/>
    </svg>
    <div id="adKicker"></div>
    <div id="adTitle" class="kufi"></div>
    <div id="adTime" class="kufi"></div>
    <div id="adDua"><div id="adDuaText"></div><div id="adDuaRef"></div></div>
    <div id="adHint"></div>
  </div>

  <div id="splash" class="overlay show">
    <div id="splashCard">
      <svg class="frame" viewBox="0 0 440 410" aria-hidden="true">
        <path d="M14 404V150C14 92 114 50 220 12C326 50 426 92 426 150V404Z" fill="#071019" fill-opacity="0.92" stroke="#D6AE62" stroke-width="2"/>
        <path d="M26 404V152C26 100 120 62 220 27C320 62 414 100 414 152V404" fill="none" stroke="#D6AE62" stroke-opacity="0.35" stroke-width="1"/>
      </svg>
      <div id="splashIcon"></div>
      <div id="splashTitle" class="kufi">مواقيت الصلاة</div>
      <div id="splashText">اضغط OK في الريموت ليعمل الأذان تلقائياً في أوقاته.</div>
      <button id="startBtn" type="button">تفعيل الأذان</button>
      <div id="splashKeys">الزر الأحمر يجرّب صوت الأذان، والزر الأخضر يكتمه أو يعيده.</div>
    </div>
  </div>
</div>

<audio id="adhanAudio" preload="auto"></audio>
<audio id="fajrAudio" preload="auto"></audio>

<script>
/*ENGINE-START*/
/* حساب مواقيت الصلاة فلكياً + التاريخ الهجري + طور القمر — ES5 ليعمل على متصفحات التلفزيون القديمة */
var PrayerEngine = (function () {
  var RAD = Math.PI / 180;
  function dsin(d) { return Math.sin(d * RAD); }
  function dcos(d) { return Math.cos(d * RAD); }
  function dtan(d) { return Math.tan(d * RAD); }
  function dasin(x) { return Math.asin(x) / RAD; }
  function dacos(x) { return Math.acos(x) / RAD; }
  function datan2(y, x) { return Math.atan2(y, x) / RAD; }
  function dacot(x) { return Math.atan(1 / x) / RAD; }
  function fix(a, b) { a = a - b * Math.floor(a / b); return a < 0 ? a + b : a; }
  function fixAngle(a) { return fix(a, 360); }
  function fixHour(a) { return fix(a, 24); }

  var METHODS = {
    MWL:       { name: 'رابطة العالم الإسلامي', fajr: 18,   isha: 17 },
    Egypt:     { name: 'الهيئة المصرية العامة للمساحة', fajr: 19.5, isha: 17.5 },
    UmmAlQura: { name: 'أم القرى', fajr: 18.5, ishaMinutes: 90 },
    Karachi:   { name: 'جامعة العلوم الإسلامية بكراتشي', fajr: 18, isha: 18 },
    ISNA:      { name: 'الجمعية الإسلامية لأمريكا الشمالية', fajr: 15, isha: 15 }
  };

  // اليوم اليولياني عند منتصف الليل (0h UT)
  function julian(year, month, day) {
    if (month <= 2) { year -= 1; month += 12; }
    var A = Math.floor(year / 100);
    var B = 2 - A + Math.floor(A / 4);
    return Math.floor(365.25 * (year + 4716)) + Math.floor(30.6001 * (month + 1)) + day + B - 1524.5;
  }

  // ميل الشمس ومعادلة الزمن
  function sunPosition(jd) {
    var D = jd - 2451545.0;

  /* ===== الصوت ===== */

    var a = S.adhan, el = Date.now() - a.start;
    if (a.phase === 'adhan') {
      if (a.sound !== 'file' && el > 25000) showDua();
      else if (el > 6 * 60000) showDua();
    } else if (Date.now() - a.duaStart > 60000) {
      stopAdhan();
    }
  }
  function checkAdhan(n) {
    for (var i = 0; i < PRAYERS.length; i++) {
      var pr = PRAYERS[i];
      if (!pr.adhan || !CONFIG.adhanFor[pr.k]) continue;
      var t = S.T[pr.k], id = S.key + pr.k;
      if (n >= t && n - t < 180000 && !S.played[id]) { S.played[id] = 1; startAdhan(pr.k, t, false); }
    }
  }

  /* ===== التحكم بالريموت ===== */
  function hideSplash() { S.splash = false; $('splash').className = 'overlay'; }
  function tryFullscreen() {
    var d = document.documentElement, f = d.requestFullscreen || d.webkitRequestFullscreen || d.webkitRequestFullScreen;
    if (!f) return;
    try { var r = f.call(d); if (r && r.then) r.then(null, function () {}); } catch (e) {}
  }
  function startFromSplash() { unlock(); tryFullscreen(); hideSplash(); }
  function toggleMute() {
    S.muted = !S.muted;
    try { window.localStorage.setItem('adhanMuted', S.muted ? '1' : '0'); } catch (e) {}
    if (S.muted) stopAudio();
    updateStatus();
  }
  function onKey(e) {
    var k = e.keyCode || e.which;
    var ok = k === 13, back = (k === 8 || k === 27 || k === 461 || k === 10009);
    if (S.splash) { if (ok) { e.preventDefault(); startFromSplash(); } return; }
    if (S.adhan) { if (ok || back) { e.preventDefault(); unlock(); stopAdhan(); } return; }
    if (ok) { unlock(); return; }
    if (k === 403 || k === 84) { unlock(); startAdhan('dhuhr', now(), true); return; }
    if (k === 404 || k === 77) { toggleMute(); return; }
  }

  /* ===== الحلقة الرئيسية ===== */
  function tick() {
    var n = now(), p = parts(n);
    if (p.y * 10000 + p.m * 100 + p.d !== S.key) recompute(n);
    renderClock(p);
    var r = findNext(n), nk = r.next.k + r.next.day;
    if (nk !== S.nextKey) { S.nextKey = nk; renderBays(n, r.next); }
    renderCountdown(n, r.next);
    checkAdhan(n);
    if (Math.abs(n - S.lastSky) > 15000 * Math.max(1, SPEED / 20) || S.lastSky === 0) { updateSky(n); S.lastSky = n; }
    rotateVerse();
    if (S.adhan) updateAdhan();
  }
  function loop() {
    try { tick(); } catch (e) { if (window.console) console.error(e); }
    setTimeout(loop, FAKE0 === null ? 1000 - (Date.now() % 1000) + 15 : 250);
  }

  function init() {
    fit();
    window.addEventListener('resize', fit);
    try { S.muted = window.localStorage.getItem('adhanMuted') === '1'; } catch (e) {}
    $('city').textContent = CONFIG.city;
    $('country').textContent = CONFIG.country;
    $('splashTitle').textContent = 'مواقيت الصلاة في ' + CONFIG.city;
    $('splashIcon').innerHTML = SVG_OPEN.replace('stroke-width="1.5"', 'stroke-width="1.2"') + ICONS.isha + '</svg>';
    buildStars(); buildWaves(); buildArcade();
    buildLantern($('lanternL'), 6.5);
    buildLantern($('lanternR'), 8.8);
    initAudio();
    updateStatus();
    document.addEventListener('keydown', onKey);
    $('startBtn').addEventListener('click', function (e) { e.preventDefault(); startFromSplash(); });
    $('adhan').addEventListener('click', function () { unlock(); stopAdhan(); });
    document.addEventListener('click', function () { if (!S.splash) unlock(); });
    try { $('startBtn').focus(); } catch (e) {}
    if (FAKE0 !== null) $('demoBadge').style.display = 'block';
    loop();
    setTimeout(function () { if (S.splash) hideSplash(); }, 30000);
    setInterval(function () {
      var r = rng(Date.now() % 100000);
      $('ui').style.transform = 'translate(' + ((r() - 0.5) * 0.3).toFixed(2) + 'rem,' + ((r() - 0.5) * 0.3).toFixed(2) + 'rem)';
    }, 240000);
    setInterval(function () { $('moonLit').setAttribute('d', moonPath(PrayerEngine.moonPhase(now()))); }, 3600000);
    if (P.nosplash === '1') hideSplash();
    if (P.demo === 'adhan' || P.demo === 'dua') {
      hideSplash();
      setTimeout(function () { startAdhan('asr', S.T.asr, false); if (P.demo === 'dua') showDua(); }, 300);
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</body>
